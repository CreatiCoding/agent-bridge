<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>로컬 화면</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <strong id="host">로컬 화면</strong>
  <span id="link" class="pill"></span>
  <span class="grow"></span>
  <button id="logout" class="ghost" hidden>나가기</button>
</header>
<main id="login" class="center" hidden>
  <h1>이 맥의 로컬 화면</h1>
  <p>서버가 닿지 않아도 이 맥의 세션을 보고, 새로 만들고, 글·파일을 보낼 수 있어요.</p>
  <p>맥 터미널에서 아래 명령으로 링크를 받아 여세요(5분 안에 한 번).</p>
  <pre>node ~/.claude-bridge/agent.mjs local</pre>
  <p id="login-msg" class="warn"></p>
</main>
<main id="app" hidden>
  <nav aria-label="세션">
    <button id="new" type="button" class="primary">＋ 새 세션</button>
    <div id="sessions"></div>
  </nav>
  <section id="view">
    <div id="empty" class="center"><p>세션을 고르거나 새 세션을 시작하세요.</p></div>
    <form id="newpane" class="center" hidden>
      <h2>새 세션</h2>
      <label for="new-cwd">작업 폴더</label>
      <input id="new-cwd" list="cwds" autocomplete="off" spellcheck="false" placeholder="~/projects/my-app">
      <datalist id="cwds"></datalist>
      <label for="new-prompt">첫 글 (비워도 돼요)</label>
      <textarea id="new-prompt" rows="4"></textarea>
      <div class="row">
        <button type="submit" class="primary">시작</button>
        <button type="button" id="new-cancel" class="ghost">취소</button>
      </div>
      <p id="new-msg" class="muted" aria-live="polite"></p>
    </form>
    <div id="pane" hidden>
      <div class="bar">
        <strong id="title"></strong>
        <span id="phase" class="pill"></span>
        <span class="grow"></span>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="conv" aria-selected="true">대화</button>
          <button type="button" role="tab" data-tab="term" aria-selected="false">터미널</button>
        </div>
        <button type="button" id="close" class="ghost">닫기</button>
      </div>
      <div id="card" hidden></div>
      <div id="conv" tabindex="0" aria-live="polite"></div>
      <pre id="screen" tabindex="0" hidden></pre>
      <div class="keys">
        <button data-esc>Esc 멈추기</button>
        <button data-key="Enter">Enter</button>
        <button data-key="Up">↑</button>
        <button data-key="Down">↓</button>
        <button data-key="Tab">Tab</button>
        <button data-key="C-c">Ctrl-C</button>
      </div>
      <div id="chips" hidden></div>
      <form id="send">
        <button type="button" id="attach" class="ghost" title="파일·그림 붙이기" aria-label="파일·그림 붙이기">📎</button>
        <input id="files" type="file" multiple hidden>
        <textarea id="text" rows="3" placeholder="세션에 보낼 글 (⌘/Ctrl+Enter 로 보내기)"></textarea>
        <button type="submit">보내기</button>
      </form>
      <p id="msg" class="muted" aria-live="polite"></p>
    </div>
  </section>
</main>
<footer id="foot" class="muted"></footer>
</body>
</html>
